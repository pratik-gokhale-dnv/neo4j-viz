[project]
name = "neo4j-viz"
version = "0.1.0"
description = "Interactive Neo4j graph database visualizer with FastAPI and D3.js"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    "neo4j>=5.28.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
]
